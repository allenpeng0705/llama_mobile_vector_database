plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.llamamobile.androidsdkexample'
    compileSdk 34

    defaultConfig {
        applicationId "com.llamamobile.androidsdkexample"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
            stl "c++_shared"
        }
    }
    
    externalNativeBuild {
        cmake {
            path '../../../llama_mobile_vd-android-SDK/src/main/cpp/CMakeLists.txt'
            version "3.18.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }

    sourceSets {
        main {
            java {
                srcDirs += ['../../llama_mobile_vd-android-SDK/src/main/java']
            }
            
            kotlin {
                srcDirs += ['../../llama_mobile_vd-android-SDK/src/main/java']
            }
            
            // Add native libraries
            jniLibs {
                srcDirs += ['../../llama_mobile_vd-android-SDK/src/main/jniLibs']
            }
        }
    }    

}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
